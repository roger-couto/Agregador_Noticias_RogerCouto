services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agora"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  embeddings:
    build:
      context: ../../embedding-service
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_MODEL_REVISION: e62509716f15c5fd03a6fd3156a4bc5e43f83f26
      HF_HOME: /model-cache
    volumes:
      - embedding_model_cache:/model-cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agora
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EMBEDDING_SERVICE_URL: http://embeddings:8001
      NEWSAPI_KEY: ${NEWSAPI_KEY:?Defina NEWSAPI_KEY no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
    ports:
      # O acesso remoto é feito por túnel SSH; não publico a API na internet.
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  embedding_model_cache:
