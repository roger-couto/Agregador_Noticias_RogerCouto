# Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/agora_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# Encoding (garante que @PathVariable com acentos chegue corretamente como UTF-8)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.servlet.path=/

# NewsAPI
newsapi.key=${NEWSAPI_KEY:8b99fc4623c543c39a17ffb9faae3a2d}
newsapi.base-url=https://newsapi.org/v2

# JWT
jwt.secret=${JWT_SECRET:agoraSuperSecretKeyForJWT2025NewsAggregatorProject}
jwt.expiration=86400000

# Logging
logging.level.br.com.agora=DEBUG